<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>교사 간식 주문 도우미</title>
<style>
:root{--p:#4f46e5;--pd:#3730a3;--bg:#f7f8fc;--card:#fff;--t:#1f2937;--m:#6b7280;--b:#e5e7eb;--ok:#15803d;--okbg:#ecfdf5;--warn:#b45309;--warnbg:#fffbeb;--danger:#b91c1c;--dangerbg:#fef2f2;--shadow:0 7px 24px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:980px;margin:auto;padding:0 14px}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--b)}.topin{max-width:980px;margin:auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:900;letter-spacing:-.04em}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.tab{padding:12px;border:1px solid var(--b);border-radius:13px;background:#fff;font-weight:800;color:var(--m)}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}.hero{padding:18px 0 3px}.hero h1{margin:0 0 5px;font-size:27px;letter-spacing:-.04em}.hero p{margin:0;color:var(--m);font-size:13px}.card{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}.input,.select,.ta{width:100%;border:1px solid #d1d5db;border-radius:11px;padding:11px 12px;background:#fff;outline:none}.input:focus,.select:focus,.ta:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.12)}.ta{min-height:110px;resize:vertical}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:6px}.primary{background:var(--p);color:#fff}.primary:hover{background:var(--pd)}.second{background:#eef2f7;color:#334155}.ghost{background:#fff;border:1px solid var(--b);color:#334155}.danger{background:var(--danger);color:#fff}.success{background:#16a34a;color:#fff}.sm{font-size:12px;padding:8px 10px}.row{display:flex;gap:8px;align-items:center}.wraprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.muted{color:var(--m)}.note{padding:11px 13px;border-radius:12px;font-size:13px;margin:10px 0}.info{background:#eef2ff;color:#3730a3}.ok{background:var(--okbg);color:#166534}.warn{background:var(--warnbg);color:#92400e}.bad{background:var(--dangerbg);color:#991b1b}.hide{display:none!important}.infoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.infoBox{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:11px}.infoBox small{display:block;color:var(--m);font-size:11px}.infoBox strong{display:block;margin-top:3px;font-size:14px}.menus{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menu{position:relative;border:1px solid var(--b);border-radius:13px;padding:12px;display:flex;gap:9px;align-items:center;background:#fff}.menu.sel{border-color:var(--p);background:#eef2ff}.menu input{position:absolute;opacity:0}.dot{width:19px;height:19px;border:2px solid #cbd5e1;border-radius:50%;flex:none}.menu.sel .dot{border-color:var(--p);box-shadow:inset 0 0 0 4px #fff;background:var(--p)}.menuName{font-weight:800}.stats .box{padding:13px;border:1px solid var(--b);border-radius:14px;background:#fff}.stats .n{font-size:11px;color:var(--m)}.stats .v{font-size:30px;font-weight:900;letter-spacing:-.05em;line-height:1.1;margin-top:5px}.progress{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:11px}.progress span{display:block;height:100%;background:var(--p)}.tablewrap{overflow:auto;border:1px solid var(--b);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:600px;background:#fff}th,td{padding:10px 11px;border-bottom:1px solid var(--b);font-size:12px;text-align:left}th{background:#f8fafc;color:#475569}tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}.bopen{background:#e0e7ff;color:#3730a3}.bfinal{background:#dcfce7;color:#166534}.bclose{background:#fef3c7;color:#92400e}.menuEdit{display:grid;grid-template-columns:1.4fr .7fr auto;gap:7px;margin-bottom:8px}.sep{height:1px;background:var(--b);margin:16px 0}.foot{padding:2px 0 35px;color:#64748b;font-size:11px;line-height:1.6}.empty{padding:25px;text-align:center;color:var(--m);border:1px dashed #cbd5e1;border-radius:13px;background:#fff}.right{text-align:right}.hidden{display:none!important}@media(max-width:720px){.grid2,.grid3,.infoGrid,.menus{grid-template-columns:1fr}.wrap{padding:0 11px}.hero h1{font-size:24px}.card{padding:14px}.menuEdit{grid-template-columns:1fr 105px auto}table{min-width:540px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">☕ 교사 간식 주문 도우미</div><button class="btn ghost sm" id="wipe">초기화</button></div></div>
<main class="wrap"><div class="hero"><h1>교사 간식 주문</h1><p>교사는 간단히 선택하고, 담당자는 수량·금액을 자동으로 확인합니다.</p></div>
<div class="tabs"><button class="tab on" id="tabTeacher">교사 신청</button><button class="tab" id="tabAdmin">담당자 관리</button></div>
<section id="teacher"></section><section id="admin" class="hide"></section><div class="foot">단일 HTML 파일 조건 때문에 서버/API 없는 환경에서는 서로 다른 스마트폰의 실시간 동기화가 불가능합니다. 이 파일은 같은 브라우저에서는 자동 저장하고, 다른 기기에서는 <b>신청용 주문 파일 → 교사 신청 결과 파일 → 담당자 일괄 가져오기</b> 방식으로 데이터를 이동할 수 있게 구성되어 있습니다.</div></main>
<script>
'use strict';
const KEY='snack_order_single_html_v2',PW='a7935',MAX=5,MAX_MEMBERS=80;const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const uid=p=>'_'+p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random());
const won=n=>new Intl.NumberFormat('ko-KR').format(Number(n)||0)+'원';
const fd=v=>{let d=new Date(v);return isNaN(d)?'-':`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`};
const fdt=v=>{let d=new Date(v);return isNaN(d)?'-':`${fd(v)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const today=()=>{let d=new Date();return d.toISOString().slice(0,10)};
const state0=()=>({version:2,members:[],orders:[],roundCounters:{},active:null});
let S=load(),mode='teacher',auth=false;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x||!x.version)return state0();x={...state0(),...x};for(let o of x.orders||[]){if(!o.memberSnapshot)o.memberSnapshot=(x.members||[]).map(m=>({...m}));}return x}catch(e){return state0()}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function clean(){let cut=Date.now()-30*86400000;S.orders=S.orders.filter(o=>new Date(o.distributionDate||o.createdAt).getTime()>=cut);if(S.active&&!S.orders.some(o=>o.id===S.active))S.active=null;save()}
clean();
function order(){return S.active?S.orders.find(o=>o.id===S.active)||null:S.orders.filter(o=>o.status==='open').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0]||null}
function counts(o){let c={};o.menus.forEach(m=>c[m.id]=0);Object.values(o.responses||{}).forEach(id=>{if(c[id]!==undefined)c[id]++});return c}
function total(o){let c=counts(o);return o.menus.reduce((a,m)=>a+(c[m.id]||0)*Number(m.price||0),0)}
function closed(o){return new Date(o.deadline).getTime()<=Date.now()}
function status(o){return o.status==='finalized'?'<span class="badge bfinal">주문 확정</span>':closed(o)?'<span class="badge bclose">신청 마감</span>':'<span class="badge bopen">신청 중</span>'}
function groupNames(){return [...new Set(S.members.map(m=>m.group).filter(Boolean))]}
function render(){ $('#tabTeacher').classList.toggle('on',mode==='teacher');$('#tabAdmin').classList.toggle('on',mode==='admin');$('#teacher').classList.toggle('hide',mode!=='teacher');$('#admin').classList.toggle('hide',mode!=='admin');mode==='teacher'?renderTeacher():renderAdmin() }
$('#tabTeacher').onclick=()=>{mode='teacher';render()};$('#tabAdmin').onclick=()=>{mode='admin';render()};

function renderTeacher(){let root=$('#teacher'),o=order();if(!o){root.innerHTML=`<div class="card"><div class="empty"><div style="font-size:38px">☕</div><h3>현재 신청 가능한 간식 주문이 없습니다.</h3><p>담당자가 만든 신청용 주문 파일을 받아 불러올 수 있습니다.</p><label class="btn primary">신청용 주문 파일 불러오기<input id="tshare" type="file" accept="application/json" class="hide"></label></div></div>`;$('#tshare').onchange=importShare;return}
let closedNow=closed(o),groups=groupNames();root.innerHTML=`<div class="card"><div class="wraprow" style="justify-content:space-between"><div><div class="muted" style="font-size:12px">${esc(o.roundLabel)}</div><h2 style="margin:2px 0">${esc(o.outlet)}</h2><div class="muted">배부일 ${fd(o.distributionDate)}</div></div>${status(o)}</div><div class="infoGrid" style="margin-top:12px"><div class="infoBox"><small>주문하는 곳</small><strong>${esc(o.outlet)}</strong></div><div class="infoBox"><small>배부일</small><strong>${fd(o.distributionDate)}</strong></div><div class="infoBox"><small>신청 마감</small><strong>${fdt(o.deadline)}</strong></div></div></div>
<div class="card"><h3>내 간식 신청</h3>${closedNow?'<div class="note warn">신청 마감 시간이 지나 신청·수정을 할 수 없습니다.</div>':'<div class="note info">소속과 이름을 다시 선택하면 기존 신청이 자동으로 불러와집니다.</div>'}<label class="label">① 소속</label><select id="tg" class="select" ${closedNow?'disabled':''}><option value="">선택해주세요</option>${groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select><div style="height:10px"></div><label class="label">② 이름</label><select id="tn" class="select" ${closedNow?'disabled':''}><option value="">소속을 먼저 선택해주세요</option></select><div id="tmenu" style="margin-top:13px"></div><button id="tsubmit" class="btn primary" style="width:100%;margin-top:13px" ${closedNow?'disabled':''}>신청하기</button><div id="tmsg"></div><div style="margin-top:10px"><label class="btn second sm">다른 기기의 신청용 주문 파일 불러오기<input id="tshare2" type="file" accept="application/json" class="hide"></label></div></div>`;
$('#tg').onchange=()=>{let g=$('#tg').value;$('#tn').innerHTML='<option value="">이름을 선택해주세요</option>'+S.members.filter(m=>m.group===g).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');drawTeacherMenu()};$('#tn').onchange=drawTeacherMenu;$('#tsubmit').onclick=submitTeacher;$('#tshare2').onchange=importShare;drawTeacherMenu();}
function drawTeacherMenu(){let o=order(),mid=$('#tn')?.value,area=$('#tmenu');if(!area)return;if(!mid){area.innerHTML='<div class="note info">이름을 선택하면 주문할 음료가 표시됩니다.</div>';return}let selected=o.responses?.[mid]||'';area.innerHTML='<label class="label">③ 주문할 음료를 1개 선택해주세요</label><div class="menus">'+o.menus.map(m=>`<label class="menu ${selected===m.id?'sel':''}"><input type="radio" name="tm" value="${m.id}" ${selected===m.id?'checked':''}><span class="dot"></span><span class="menuName">${esc(m.name)}</span></label>`).join('')+'</div>'+(selected?'<div class="note ok">기존 신청이 자동으로 불러와졌습니다. 마감 전까지 변경할 수 있습니다.</div>':'');$$('#tmenu input').forEach(x=>x.onchange=()=>{$$('#tmenu .menu').forEach(y=>y.classList.remove('sel'));x.closest('.menu').classList.add('sel')})}
function submitTeacher(){let o=order();if(!o||closed(o)){alert('신청 마감 시간이 지났습니다.');return}let mid=$('#tn').value,menu=$('#tmenu input:checked')?.value;if(!mid){alert('이름을 선택해주세요.');return}if(!menu){alert('주문할 음료를 1개 선택해주세요.');return}o.responses=o.responses||{};o.responses[mid]=menu;o.updatedAt=new Date().toISOString();save();let m=S.members.find(x=>x.id===mid),mn=o.menus.find(x=>x.id===menu);$('#tmsg').innerHTML=`<div class="note ok"><b>${esc(m.name)}</b>님의 신청이 저장되었습니다.<br>선택 음료: <b>${esc(mn.name)}</b></div><button class="btn second sm" id="tresp">내 신청 결과 파일 저장</button>`;$('#tresp').onclick=()=>download('간식신청_'+o.roundLabel+'_'+m.name+'.json',{type:'teacher-response',version:2,orderId:o.id,memberId:mid,menuId:menu,submittedAt:new Date().toISOString()})}
function importShare(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.type!=='order-share'||x.version!==2)throw 0;let o=x.order;let imported={...o,menus:o.menus.map(m=>({...m,price:0})),responses:{},status:'open',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};S.members=x.members;let i=S.orders.findIndex(y=>y.id===o.id);if(i>=0)imported.responses=S.orders[i].responses||{};i>=0?S.orders[i]=imported:S.orders.push(imported);S.active=o.id;save();render();alert('신청용 주문 정보를 불러왔습니다.');}catch(err){alert('올바른 신청용 주문 파일이 아닙니다.')}e.target.value=''};r.readAsText(f)}

function renderAdmin(){let root=$('#admin');if(!auth){root.innerHTML=`<div class="card" style="max-width:500px;margin:auto"><h2>담당자 로그인</h2><p class="muted">담당자 전용 비밀번호를 입력해주세요.</p><input id="pw" class="input" type="password" placeholder="비밀번호"><button class="btn primary" id="login" style="width:100%;margin-top:10px">관리자 화면 열기</button></div>`;$('#login').onclick=()=>{$('#pw').value===PW?(auth=true,render()):alert('비밀번호가 올바르지 않습니다.')};$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#login').click()};return}
let o=order(),orders=[...S.orders].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));root.innerHTML=`<div class="wraprow" style="justify-content:space-between;margin-bottom:10px"><div><h2 style="margin:0">담당자 관리</h2><div class="muted" style="font-size:12px">최대 80명의 교직원 명단과 간식 주문을 관리합니다.</div></div><button class="btn second sm" id="logout">로그아웃</button></div>
<div class="grid2"><div class="card"><h3>① 교직원 명단</h3><div class="note info">교직원은 <b>최대 80명</b>까지 등록할 수 있습니다. 엑셀 파일(.xlsx)을 한 번에 불러오거나 아래 입력창에 직접 붙여넣을 수 있습니다.</div><div class="note">엑셀 첫 번째 시트에 <b>소속</b>, <b>이름</b> 두 열을 준비해주세요. 첫 행은 제목(소속 / 이름)으로 두는 것을 권장합니다.</div><div class="wraprow" style="margin-bottom:10px"><label class="btn second">엑셀로 명단 전체 교체<input id="xlsxReplace" type="file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" class="hide" data-mode="replace"></label><label class="btn second">엑셀 명단 추가/업데이트<input id="xlsxMerge" type="file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" class="hide" data-mode="merge"></label></div><textarea id="bulk" class="ta" placeholder="예: 윤빛반\t이지영\n윤빛반\t김○○\n보조교사\t박○○"></textarea><button class="btn primary" id="addMembers" style="margin-top:8px">명단 등록/추가</button><div id="rosterMsg"></div><div style="margin-top:12px"><b>현재 ${S.members.length}명 / 최대 ${MAX_MEMBERS}명</b></div><div class="tablewrap" style="max-height:240px;margin-top:8px"><table><thead><tr><th>소속</th><th>이름</th><th></th></tr></thead><tbody>${S.members.map(m=>`<tr><td>${esc(m.group)}</td><td>${esc(m.name)}</td><td class="right"><button class="btn danger sm" data-del="${m.id}">삭제</button></td></tr>`).join('')||'<tr><td colspan="3">등록된 명단이 없습니다.</td></tr>'}</tbody></table></div></div>
<div class="card"><h3>② 새 간식 주문 만들기</h3><label class="label">주문하는 곳</label><input id="outlet" class="input" placeholder="예: 읍천리 커피"><div class="grid2" style="margin-top:9px"><div><label class="label">실제 간식 배부일</label><input id="dist" type="date" class="input" value="${today()}"></div><div><label class="label">신청 마감 날짜</label><input id="ddate" type="date" class="input" value="${today()}"></div></div><div style="margin-top:9px"><label class="label">신청 마감 시간</label><input id="dtime" type="time" class="input" value="18:00"></div><div style="margin-top:12px"><label class="label">주문할 음료 (4~5개 권장, 최대 5개)</label><div id="menuEditor"></div><button class="btn second sm" id="addMenu">+ 음료 추가</button></div><button id="create" class="btn success" style="width:100%;margin-top:13px">간식 신청 시작</button></div></div>
<div class="card"><h3>③ 현재 주문 집계</h3><div id="dashboard">${o?dash(o):'<div class="empty">현재 활성화된 주문이 없습니다.</div>'}</div></div>
<div class="card"><h3>④ 주문 회차 내역</h3><div class="tablewrap"><table><thead><tr><th>회차</th><th>주문처</th><th>배부일</th><th>상태</th><th>신청</th><th>총금액</th><th></th></tr></thead><tbody>${orders.map(x=>`<tr><td>${esc(x.roundLabel)}</td><td>${esc(x.outlet)}</td><td>${fd(x.distributionDate)}</td><td>${status(x)}</td><td>${Object.keys(x.responses||{}).length}명</td><td>${won(total(x))}</td><td><button class="btn ghost sm" data-history="${x.id}">열기</button></td></tr>`).join('')||'<tr><td colspan="7">주문 회차가 없습니다.</td></tr>'}</tbody></table></div></div>
<div class="card"><h3>⑤ 데이터 이동/백업</h3><p class="muted" style="font-size:12px">다른 휴대폰을 사용할 때는 현재 주문의 <b>신청용 주문 파일</b>을 공유하고, 교사가 저장한 <b>신청 결과 파일</b>들을 담당자에게 받아 일괄 가져오세요.</p><div class="wraprow"><button class="btn second" id="exportAll">전체 백업</button><label class="btn second">전체 백업 가져오기<input id="impAll" type="file" accept="application/json" class="hide"></label><button class="btn second" id="exportShare">현재 주문 신청용 파일</button><label class="btn second">교사 신청 파일 여러 개 가져오기<input id="impResp" type="file" accept="application/json" multiple class="hide"></label></div></div>`;
let me=[{name:'',price:''},{name:'',price:''},{name:'',price:''},{name:'',price:''}];

function editMeta(o){let h=`<div class="card"><div class="wraprow" style="justify-content:space-between"><h3>주문 정보 수정</h3><button class="btn ghost sm" id="closeMeta">닫기</button></div><div class="grid2"><div><label class="label">주문하는 곳</label><input id="eo" class="input" value="${esc(o.outlet)}"></div><div><label class="label">배부일</label><input id="ed" type="date" class="input" value="${o.distributionDate}"></div></div><div style="margin-top:9px"><label class="label">신청 마감</label><input id="edt" type="datetime-local" class="input" value="${localDT(o.deadline)}"></div><div style="margin-top:10px"><label class="label">메뉴 및 가격</label>${o.menus.map((m,i)=>`<div class="menuEdit"><input id="emn${i}" class="input" value="${esc(m.name)}"><input id="emp${i}" class="input" type="number" min="0" value="${m.price}"><span></span></div>`).join('')}</div><button class="btn primary" id="saveMeta" style="margin-top:10px">저장</button></div>`;$('#dashboard').insertAdjacentHTML('afterend',h);$('#closeMeta').onclick=e=>e.target.closest('.card').remove();$('#saveMeta').onclick=()=>{let deadline=new Date($('#edt').value);if(!$('#eo').value.trim()||!$('#ed').value||isNaN(deadline))return alert('필수 정보를 확인해주세요.');o.outlet=$('#eo').value.trim();o.distributionDate=$('#ed').value;o.deadline=deadline.toISOString();o.menus.forEach((m,i)=>{m.name=$(`#emn${i}`).value.trim()||m.name;m.price=Number($(`#emp${i}`).value)||0});o.updatedAt=new Date().toISOString();save();render()}}
function localDT(v){let d=new Date(v),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function showHistory(id){let o=S.orders.find(x=>x.id===id);if(!o)return;let h=`<div class="card"><div class="wraprow" style="justify-content:space-between"><div><h3>${esc(o.roundLabel)}</h3><div class="muted">${esc(o.outlet)} · 배부일 ${fd(o.distributionDate)}</div></div><button class="btn ghost sm" id="closeHist">닫기</button></div><div class="grid3 stats" style="margin-top:10px"><div class="box"><div class="n">신청</div><div class="v">${Object.keys(o.responses||{}).length}명</div></div><div class="box"><div class="n">총 금액</div><div class="v" style="font-size:20px">${won(total(o))}</div></div><div class="box"><div class="n">상태</div><div style="margin-top:8px">${status(o)}</div></div></div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>음료</th><th>수량</th><th>단가</th><th>금액</th></tr></thead><tbody>${o.menus.map(m=>{let c=counts(o)[m.id]||0;return `<tr><td>${esc(m.name)}</td><td>${c}</td><td>${won(m.price)}</td><td>${won(c*m.price)}</td></tr>`}).join('')}</tbody></table></div><div class="wraprow" style="margin-top:10px"><button class="btn second" id="hr">교사별 주문 보기</button><button class="btn second" id="he">관리자 수정</button></div></div>`;$('#admin').insertAdjacentHTML('beforeend',h);$('#closeHist').onclick=e=>e.target.closest('.card').remove();$('#hr').onclick=()=>showResponses(o);$('#he').onclick=()=>editAfter(o)}
function download(name,data){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
function exportShare(){let o=order();if(!o)return alert('현재 주문이 없습니다.');download('교사간식_신청용_'+o.roundLabel+'.json',{type:'order-share',version:2,order:{id:o.id,roundLabel:o.roundLabel,outlet:o.outlet,distributionDate:o.distributionDate,deadline:o.deadline,menus:o.menus.map(m=>({id:m.id,name:m.name}))},members:S.members.map(m=>({id:m.id,group:m.group,name:m.name}))})}
function importAll(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.version!==2)throw 0;S=x;save();render();alert('전체 백업을 가져왔습니다.')}catch(err){alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};r.readAsText(f)}
function importResponses(e){let fs=[...e.target.files||[]],ok=0,fail=0;fs.forEach(f=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),o=S.orders.find(o=>o.id===x.orderId),m=S.members.find(m=>m.id===x.memberId),mn=o?.menus.find(m=>m.id===x.menuId);if(x.type!=='teacher-response'||x.version!==2||!o||!m||!mn)throw 0;o.responses=o.responses||{};o.responses[x.memberId]=x.menuId;o.updatedAt=new Date().toISOString();save();ok++}catch(err){fail++}if(ok+fail===fs.length){render();alert(`교사 신청 파일 처리 완료: 성공 ${ok}건 / 실패 ${fail}건`);e.target.value=''}};r.readAsText(f)})}
$('#wipe').onclick=()=>{let p=prompt('전체 데이터 삭제를 위해 담당자 비밀번호를 입력해주세요.');if(p!==PW)return;if(confirm('이 브라우저의 모든 데이터를 삭제할까요?')&&confirm('정말 삭제하시겠습니까?')){localStorage.removeItem(KEY);S=state0();auth=false;mode='teacher';render()}};
// 대시보드 버튼 바인딩: renderAdmin 내부에서 dashboard HTML 생성 후 연결
const renderAdminRaw=renderAdmin;
// dash 버튼을 연결하는 래퍼로 교체
renderAdmin=function(){renderAdminRaw();let o=order();if(auth&&o){bindDashboard(o)}};
render();
</script>
</body></html>
